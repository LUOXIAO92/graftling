[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graftling"
dynamic = ["version"]
description = "Independent native Agent control and optional native Session archives."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6,<7",
    "websockets>=15,<17",
]

[project.scripts]
subagents = "graftling.cli:main"
subagents-mcp = "graftling.mcp:main"

[tool.setuptools]
packages = ["graftling", "graftling.dsh", "graftling.claude", "graftling.pi", "graftling.codex",
            "graftling.sessions"]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "graftling.__version__"}

# Only files the installed package's users read. Two documents stay shipped because a
# caller reads the installed copies: PUBLIC_API.md (GraphTraj's
# tests/test_graphtraj_public_agents_api.py checks section 1.3) and the install guides
# (GraphTraj's tests/test_codex_parent_uses_agents.py runs the commands of
# install/<host>.md). src/graftling/PUBLIC_API.md and src/graftling/install are links to
# the repository root's PUBLIC_API.md and docs/install, so each has one copy.
# The hosts' plugins ship too, so each is taken from the one installation (581):
# graftling-dsh (dsh/), the Pi package (pi/) and the Claude Code marketplace
# (.claude-plugin/marketplace.json naming claude-plugin/).
[tool.setuptools.package-data]
graftling = ["PUBLIC_API.md", "install/*.md", "dsh/*.mjs", "dsh/package.json", "dsh/dsh.patch.yml", "claude/*.mjs",
             "pi/*.mjs", "pi/package.json", "sessions/DSH-LICENSE", "review_policy/*",
             ".claude-plugin/marketplace.json", "claude-plugin/.claude-plugin/plugin.json",
             "claude-plugin/bin/graftling-host", "claude-plugin/hooks/*"]

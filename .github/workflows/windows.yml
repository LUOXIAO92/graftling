# graftling's whole test suite on a GitHub-hosted Windows x64 runner (632, W0).
# Tests that exercise a POSIX mechanism by design skip on Windows with a reason that
# starts "POSIX-only: " (tests/posix_only.py); every other test runs. The per-file JUnit
# files, logs and records (files.json) and the job log are the evidence. No secret is used: this is a public repository.
# Step names are stable: later Windows tasks and their step scripts judge them by name.
name: Windows tests
on:
  push:
    branches: [agent/632-graftling-windows-ci, agent/633-graftling-windows-process, agent/634-graftling-windows-durable-writes, agent/635-graftling-windows-process-tree, agent/638-graftling-windows-paths-encoding, dev, agent/636-graftling-windows-named-pipe, agent/637-graftling-windows-process-listing, agent/639-graftling-windows-codex, agent/647-graftling-windows-claude, agent/649-graftling-windows-dsh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
    steps:
      # src/graftling/PUBLIC_API.md and src/graftling/install are git symbolic links;
      # without core.symlinks Git for Windows writes text stubs. Only this disposable
      # runner's configuration changes.
      - name: Keep symbolic links on this runner
        run: git config --global core.symlinks true
      - name: Check out the commit under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fail unless the linked package documents are symbolic links
        run: |
          foreach ($path in 'src/graftling/PUBLIC_API.md', 'src/graftling/install') {
            $item = Get-Item $path
            if ($item.LinkType -ne 'SymbolicLink') { throw "$path is not a symbolic link (LinkType=$($item.LinkType))" }
            "$path -> $($item.Target)"
          }
          if ((Get-Content -Raw src/graftling/PUBLIC_API.md) -ne (Get-Content -Raw PUBLIC_API.md)) { throw 'src/graftling/PUBLIC_API.md does not read as PUBLIC_API.md' }
          if (-not (Get-ChildItem src/graftling/install -Filter *.md)) { throw 'src/graftling/install has no install guides' }
      # The same pins as GraphTraj's Windows workflow (desktop-win-adoption.yml).
      - name: Set up Node 22.18.0 x64
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          architecture: x64
      - name: Set up Python 3.13.7 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.7'
          architecture: x64
      # Test tools only, pinned as GraphTraj's Windows workflow pins them; graftling's
      # package metadata is unchanged. tests/conftest.py requires an editable install,
      # so subprocesses started with -I import this checkout.
      - name: Install graftling and pinned test tools
        run: |
          python -m pip install --no-deps pip==25.3 setuptools==80.9.0 wheel==0.45.1 packaging==25.0 pytest==8.3.5 iniconfig==2.1.0 pluggy==1.6.0 colorama==0.4.6 PyYAML==6.0.2 websockets==15.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Named facts only; never the whole environment.
      - name: Show runner, Python and pytest versions
        run: |
          New-Item -ItemType Directory -Force test-results/windows | Out-Null
          $facts = [ordered]@{ commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT
            os=[Environment]::OSVersion.VersionString; image=$env:ImageOS; image_version=$env:ImageVersion
            arch=$env:PROCESSOR_ARCHITECTURE; python=(python --version); pytest=(python -m pytest --version)
            node=(node --version); git=(git --version); codepage=(Get-Culture).TextInfo.ANSICodePage }
          $facts | ConvertTo-Json | Set-Content -Encoding utf8 test-results/windows/environment.json
          $facts | Format-Table -AutoSize | Out-String -Width 200
      # The whole suite, one test file per pytest process (.github/run_test_files.py), so a
      # hung file cannot take the run with it. Each file runs `pytest -u -p no:cacheprovider
      # -v -rfEsxX --tb=short -o faulthandler_timeout=120 -o junit_family=xunit1` with its own
      # JUnit file; -v names each test as it starts and faulthandler dumps every thread of a
      # test running over 120 s. A file still running after 360 s is stopped with taskkill /T /F
      # and recorded as hung with its last started test; the next file runs. 360 s is 3.5 times
      # the slowest file on macOS (tests/test_host_shutdown_stop.py, 103 s; the whole suite
      # takes 247 s there), leaving room for slower process starts on Windows while letting
      # about ten hung files fit in the 70-minute total the driver keeps under the step bound.
      # The driver's exit code is kept beside the results: 0 or 1 means it finished.
      # The temporary directory, so every tmp_path, data root, venv and worktree the tests
      # make, sits under a non-ASCII name (638): graftling must handle such paths on Windows.
      # The name is built from code points so this file's encoding cannot alter it, and the
      # directory Python resolves is kept in temp-directory.txt (UTF-8) for the step script.
      - name: Run the graftling test suite
        timeout-minutes: 75
        run: |
          $temp = Join-Path $env:RUNNER_TEMP ('graftling-' + [char]0x6D4B + [char]0x8BD5 + '-' + [char]0x00FC)
          New-Item -ItemType Directory -Force $temp | Out-Null
          $env:TEMP = $temp
          $env:TMP = $temp
          python -c "import pathlib, tempfile; pathlib.Path('test-results/windows/temp-directory.txt').write_text(tempfile.gettempdir(), encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "temporary directory: $(Get-Content -Raw -Encoding utf8 test-results/windows/temp-directory.txt)"
          python .github/run_test_files.py --out test-results/windows --file-limit 360 --total-limit 4200
          $code = $LASTEXITCODE
          "$code" | Set-Content -Encoding ascii test-results/windows/run-exit-code.txt
          "run_test_files exit code: $code"
          exit $code
      - name: Retain JUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          # The attempt keeps a re-run's upload from colliding with the first one.
          name: graftling-windows-junit-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/windows/
          if-no-files-found: error
          retention-days: 7

  # DSH on Windows (649, W11). DSH 0.2.2-rc.5 (the README's tested version) runs on this runner
  # without a credential (run 45984855702). This job installs it with npm on Node 24.22.3 and runs
  # every tests/test_*dsh*.py against it, one pytest per file (.github/run_test_files.py), under
  # the same non-ASCII temporary directory as windows-tests. It gates: a failed install or a failed
  # test fails the job, and the step script judges the skips. The windows-tests job above is
  # unchanged and has no DSH. No provider variable is set or passed.
  dsh-windows-tests:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      DSH_VERSION: '0.2.2-rc.5'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
    steps:
      - name: Keep symbolic links on this runner
        run: git config --global core.symlinks true
      - name: Check out the commit under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # DSH 0.2.2-rc.5 needs Node >=24.9.0 (its engines); 24.22.3 is the newest 24 LTS.
      - name: Set up Node 24.22.3 x64
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.3'
          architecture: x64
      - name: Set up Python 3.13.7 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Install graftling and pinned test tools
        run: |
          python -m pip install --no-deps pip==25.3 setuptools==80.9.0 wheel==0.45.1 packaging==25.0 pytest==8.3.5 iniconfig==2.1.0 pluggy==1.6.0 colorama==0.4.6 PyYAML==6.0.2 websockets==15.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # npm's download cache only (actions/cache v4.3.0): the install below still unpacks every
      # package, runs every install script and must exit 0. The first run of a key fills it.
      - name: Restore the npm download cache
        id: npm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/npm-cache
          key: npm-cache-windows-node-24.22.3-dsh-0.2.2-rc.5
      # Gating, with npm's own exit code; its output and the timing are kept in the artifact.
      - name: Install DSH with npm
        timeout-minutes: 40
        run: |
          New-Item -ItemType Directory -Force test-results/dsh | Out-Null
          $start = Get-Date
          npm install -g --foreground-scripts --no-audit --no-fund "@deepseek-ai/dsh@$env:DSH_VERSION" *> test-results/dsh/npm-install.txt
          $code = $LASTEXITCODE
          Get-Content -Tail 30 test-results/dsh/npm-install.txt
          $facts = [ordered]@{ commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT
            os=[Environment]::OSVersion.VersionString; image=$env:ImageOS; image_version=$env:ImageVersion
            arch=$env:PROCESSOR_ARCHITECTURE; python=(python --version); pytest=(python -m pytest --version)
            node=(node --version); npm=(npm --version); codepage=(Get-Culture).TextInfo.ANSICodePage
            dsh_requested=$env:DSH_VERSION; npm_exit=$code; install_seconds=[int]((Get-Date) - $start).TotalSeconds
            npm_cache_hit='${{ steps.npm-cache.outputs.cache-hit }}'; npm_cache=(npm config get cache); npm_prefix=(npm prefix -g)
            dsh=(Get-Command dsh -ErrorAction SilentlyContinue).Source
            dsh_version=$(if ($code -eq 0) { dsh --version } else { 'not run: the install failed' }) }
          $facts | ConvertTo-Json | Set-Content -Encoding utf8 test-results/dsh/environment.json
          $facts | Format-Table -AutoSize | Out-String -Width 200
          "npm install exit code: $code"
          exit $code
      # Gating: every DSH test file, one pytest per file, as windows-tests runs the suite.
      - name: Run graftling's DSH test files against the installed DSH
        timeout-minutes: 25
        run: |
          $temp = Join-Path $env:RUNNER_TEMP ('graftling-' + [char]0x6D4B + [char]0x8BD5 + '-' + [char]0x00FC)
          New-Item -ItemType Directory -Force $temp | Out-Null
          $env:TEMP = $temp
          $env:TMP = $temp
          $files = Get-ChildItem tests -Filter 'test_*dsh*.py' | Sort-Object Name | ForEach-Object { "tests/$($_.Name)" }
          "test files: $($files -join ' ')"
          python .github/run_test_files.py --out test-results/dsh --file-limit 300 --total-limit 1200 @files
          $code = $LASTEXITCODE
          "$code" | Set-Content -Encoding ascii test-results/dsh/run-exit-code.txt
          "run_test_files exit code: $code"
          exit $code
      - name: Retain the DSH test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graftling-dsh-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/dsh/
          if-no-files-found: error
          retention-days: 7
